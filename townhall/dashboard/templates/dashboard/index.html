<!DOCTYPE html>
<html>
<head>
    <title>Townhall</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <style>
        body { font-family: sans-serif; }
        .container { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .chart-container { border: 1px solid #ccc; padding: 10px; height: 400px; }
        #vis { width: 100%; height: 100%; }
        .placeholder { border: 2px dashed #ccc; padding: 20px; text-align: center; color: #999; }
    </style>
</head>
<body>
    <h1>Townhall</h1>

    <div>
        <label for="pawn-select">Select a Pawn:</label>
        <select id="pawn-select"></select>
        <button id="refresh-btn">Refresh</button>
        <input type="checkbox" id="auto-refresh-checkbox">
        <label for="auto-refresh-checkbox">Auto-refresh</label>
    </div>

    <div class="container">
        <div class="chart-container">
            <div id="vis"></div>
        </div>
        <div class="chart-container">
            <div class="placeholder">Future Chart 1</div>
        </div>
        <div class="chart-container">
            <div class="placeholder">Future Chart 2</div>
        </div>
        <div class="chart-container">
            <div class="placeholder">Future Chart 3</div>
        </div>
    </div>

    <script type="text/javascript">
        const pawnSelect = document.getElementById('pawn-select');
        const refreshBtn = document.getElementById('refresh-btn');
        const autoRefreshCheckbox = document.getElementById('auto-refresh-checkbox');
        let autoRefreshInterval = null;

        function fetchAndRenderChart(pawnName) {
            let url = '/dashboard/chart_data/?pawn_name=' + pawnName;
            fetch(url)
                .then(response => response.json())
                .then(spec => {
                    vegaEmbed('#vis', spec, {actions: false});
                });
        }

        function populatePawnSelect() {
            const selectedPawn = pawnSelect.value;
            fetch('/dashboard/pawn_names/')
                .then(response => response.json())
                .then(data => {
                    const pawns = data.pawn_name;
                    pawnSelect.innerHTML = '';
                    pawns.forEach(pawn => {
                        let option = document.createElement('option');
                        option.value = pawn;
                        option.textContent = pawn;
                        pawnSelect.appendChild(option);
                    });

                    // Try to re-select the previously selected pawn
                    if (pawns.includes(selectedPawn)) {
                        pawnSelect.value = selectedPawn;
                    } 

                    // Initial render or re-render with the selected pawn
                    const currentPawn = pawnSelect.value;
                    if (currentPawn) {
                        fetchAndRenderChart(currentPawn);
                    }
                });
        }

        pawnSelect.addEventListener('change', (event) => {
            fetchAndRenderChart(event.target.value);
        });

        refreshBtn.addEventListener('click', () => {
            populatePawnSelect();
        });

        autoRefreshCheckbox.addEventListener('change', (event) => {
            if (event.target.checked) {
                autoRefreshInterval = setInterval(() => {
                    populatePawnSelect();
                }, 5000); // Refresh every 5 seconds
            } else {
                clearInterval(autoRefreshInterval);
            }
        });

        // Initial population of the dropdown
        populatePawnSelect();
    </script>
</body>
</html>
