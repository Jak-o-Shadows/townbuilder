<!DOCTYPE html>
<html>
<head>
    <title>Townhall - Notice Board</title>
    <style>
        body { font-family: monospace; }
        .log-container { border: 1px solid #ccc; padding: 10px; height: 80vh; overflow-y: scroll; }
        .log-line { white-space: pre; }
        .level-trace { color: #999; }
        .level-debug { color: #777; }
        .level-info { color: #00a; }
        .level-warn { color: #a60; }
        .level-error { color: #a00; }
        .level-critical { color: #f00; font-weight: bold; }
        .logger-name { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Townhall - Notice Board</h1>

    <div>
        <label for="level-select">Log Level:</label>
        <select id="level-select">
            <option value="">All</option>
        </select>
        <label for="logger-select">Logger:</label>
        <select id="logger-select">
            <option value="">All</option>
        </select>
        <button id="refresh-btn">Refresh</button>
        <input type="checkbox" id="auto-refresh-checkbox">
        <label for="auto-refresh-checkbox">Auto-refresh</label>
    </div>

    <div class="log-container" id="log-container"></div>

    <script type="text/javascript">
        const logContainer = document.getElementById('log-container');
        const levelSelect = document.getElementById('level-select');
        const loggerSelect = document.getElementById('logger-select');
        const refreshBtn = document.getElementById('refresh-btn');
        const autoRefreshCheckbox = document.getElementById('auto-refresh-checkbox');
        let autoRefreshInterval = null;

        const loggerNameColors = {};
        const colorPalette = ['#e6194B', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4', '#42d4f4', '#f032e6', '#bfef45', '#fabed4', '#469990', '#dcbeff', '#9A6324', '#fffac8', '#800000', '#aaffc3', '#808000', '#ffd8b1', '#000075', '#a9a9a9'];
        let colorIndex = 0;

        function getLoggerNameColor(loggerName) {
            if (!loggerNameColors[loggerName]) {
                loggerNameColors[loggerName] = colorPalette[colorIndex % colorPalette.length];
                colorIndex++;
            }
            if (colorIndex > colorPalette.length) {
                colorIndex = 0;
            }

            return loggerNameColors[loggerName];
        }

        function fetchAndRenderLogs() {
            const level = levelSelect.value;
            const logger = loggerSelect.value;
            let url = '/dashboard/log_data/?';
            if (level) {
                url += 'level=' + level + '&';
            }
            if (logger) {
                url += 'logger=' + logger;
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    logContainer.innerHTML = '';
                    data.logs.forEach(log => {
                        const logLine = document.createElement('div');
                        logLine.className = 'log-line';

                        const timestamp = `[${log.timestamp}]`;
                        const thread = `[${log.thread_id}]`;
                        const level = `[${log.level}]`;
                        const logger = `[${log.logger}]`;
                        const message = log.message;

                        const levelSpan = `<span class="level-${log.level.toLowerCase()}">${level}</span>`;
                        const loggerColor = getLoggerNameColor(log.logger);
                        const loggerSpan = `<span class="logger-name" style="color: ${loggerColor};">${logger}</span>`;

                        logLine.innerHTML = `${timestamp} ${thread} ${levelSpan} ${loggerSpan} ${message}`;
                        logContainer.appendChild(logLine);
                    });

                    // Scroll to bottom
                    logContainer.scrollTop = logContainer.scrollHeight;

                    // Populate filters if they are empty
                    if (levelSelect.options.length <= 1) {
                        data.levels.forEach(level => {
                            const option = document.createElement('option');
                            option.value = level;
                            option.textContent = level;
                            levelSelect.appendChild(option);
                        });
                    }
                    if (loggerSelect.options.length <= 1) {
                        data.loggers.forEach(logger => {
                            const option = document.createElement('option');
                            option.value = logger;
                            option.textContent = logger;
                            loggerSelect.appendChild(option);
                        });
                    }
                });
        }

        refreshBtn.addEventListener('click', fetchAndRenderLogs);
        levelSelect.addEventListener('change', fetchAndRenderLogs);
        loggerSelect.addEventListener('change', fetchAndRenderLogs);

        autoRefreshCheckbox.addEventListener('change', (event) => {
            if (event.target.checked) {
                autoRefreshInterval = setInterval(fetchAndRenderLogs, 5000);
            } else {
                clearInterval(autoRefreshInterval);
            }
        });

        // Initial load
        fetchAndRenderLogs();
    </script>
</body>
</html>
