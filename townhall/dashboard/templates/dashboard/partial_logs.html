{# Main log viewer container with filter form and results #}
<header>
    Log Viewer
</header>

<section>
    <form id="log-filters"
                method="get"
                hx-get="{% url 'dashboard:log_entries' %}"
                hx-target="#log-results"
                hx-swap="innerHTML">
        <label hx-get="{% url 'dashboard:log_levels' %}"
               hx-trigger="load"
               hx-target="#log-level-select"
               hx-swap="innerHTML"
               id="log-level-select">
            <!-- Log levels will be loaded here -->
        </label>
        <label hx-get="{% url 'dashboard:log_loggers' %}"
               hx-trigger="load"
               hx-target="#log-logger-select"
               hx-swap="innerHTML"
               id="log-logger-select">
            <!-- Log loggers will be loaded here -->
        </label>
        <label>
            Search
            <input type="search" name="q" placeholder="Message" hx-get="{% url 'dashboard:log_entries' %}" hx-target="#log-results" hx-swap="innerHTML" hx-trigger="keyup changed delay:300ms" hx-include="#log-filters" />
        </label>
        <button type="submit" class="outline">Apply</button>
    </form>

    <div id="log-results" hx-get="{% url 'dashboard:log_entries' %}" hx-trigger="load" hx-swap="innerHTML">
        <!-- Initial results loaded here by HTMX -->
    </div>
</section>

<footer></footer>
