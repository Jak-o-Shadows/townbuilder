<div id="open-files-list">
    <h3>Open Database Files</h3>

    <!-- First section is the upload button, and file directory entry -->
     <div id="dataset-upload-section">
        <form action="" method="post">
            {% csrf_token %}
            {{ dataset_upload_form }}
            <input type="submit" value="Upload">
        </form>
    </div>
    <br />
    <div id="dataset-monitor-section">
        <form action="" method="post">
            {% csrf_token %}
            {{ dataset_folder_browse_form }}
            <input type="submit" value="Scan Folder">
        </form>
        <!-- Display the list of available files -->

    </div>






    <div id="available-files-list">
        <table>
            <thead>
                <tr>
                    <th>File</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for file in available_datasets %}
                    <tr>
                        <td>{{ file }}</td>
                        <td>
                        {% if not file.exists %}
                            <span class="error">Missing</span>
                        {% else %}
                            <span class="ok">OK</span>
                        {% endif %}
                        </td>
                        <td>
                            <a href="{% url 'dashboard:index' %}?dataset_id={{ file.id }}" target="_blank">
                                <button>Open in New Tab</button>
                            </a>
                            <button hx-post="{% url 'dashboard:close_file' file.id %}"
                                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                                    hx-target="#open-files-list"
                                    hx-swap="innerHTML"
                                    hx-on::after-swap="htmx.ajax('GET', '{% url 'dashboard:datasets_nav' %}', {target: 'ul.dropdown-menu', swap: 'innerHTML'})"
                                    class="outline">Close</button>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
