{# This template fragment renders a select dropdown for filtering logs by level #}
Level:
<select name="level" hx-get="{% url 'dashboard:log_entries' %}" hx-target="#log-results" hx-swap="innerHTML" hx-trigger="change" hx-include="#log-filters">
    <option value="">All</option>
    {% for level in log_levels %}
    <option class="level-{{ level }}">{{ level }}</option>
    {% endfor %}
</select>
