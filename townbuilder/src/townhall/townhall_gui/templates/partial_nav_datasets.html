{# Dropdown menu for open datasets in navbar #}
<option value="" {% if not active_dataset %}selected{% endif %}>Default database</option>
{% for dataset in open_datasets %}
    <option value="{{ dataset.id }}" {% if active_dataset.id == dataset.id %}selected{% endif %}>
        {{ dataset }}{% if not dataset.exists %} (missing){% endif %}
    </option>
{% endfor %}
