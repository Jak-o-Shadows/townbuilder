<div id="open-files-list">
    <h3>Database Files</h3>

    {% if status_message %}
        <div class="status-message">{{ status_message }}</div>
    {% endif %}

    <!-- First section is the upload button, and file directory entry -->
    <div id="dataset-upload-section">
        <form action="{% url 'townhall:upload_datasets' %}" method="post" enctype="multipart/form-data">
            {{ dataset_upload_form }}
            <input type="submit" value="Upload">
        </form>
    </div>
    <br />
    <div id="dataset-monitor-section">
        <form hx-post="{% url 'townhall:scan_dataset_folder' %}"
              hx-target="#folder-viewer"
              hx-swap="innerHTML">
            {{ folder_browse_form }}
            <input type="submit" value="Scan Folder">
        </form>
        <!-- Display the list of available files -->
        <div id="folder-viewer"></div>
    </div>





    <hr />
    {% include 'partial_available_files.html' %}
</div>
