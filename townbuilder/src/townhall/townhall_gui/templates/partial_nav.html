<nav>
    <ul>
        <li>
            <a href="{% url 'townhall:index' %}">Plots/Analysis</a>
        </li>
        <li>
            <a href="{% url 'townhall:datasets' %}">Datasets</a>
        </li>
        <li>
            <a href="{% url 'townhall:remote_file_browser' %}?dir_path=.">Remote File Browser</a>
        </li>
    </ul>
    <ul>
        <li>
            <form method="get" action="">
                <label for="navbar-dataset-select"
                       hx-get="{% url 'townhall:datasets_nav' %}{% if dataset_id %}?dataset_id={{ dataset_id }}{% endif %}"
                       hx-trigger="load, datasets-changed from:body"
                       hx-target="#navbar-dataset-select"
                       hx-swap="innerHTML">Dataset</label>
                <select id="navbar-dataset-select" name="dataset_id" onchange="this.form.requestSubmit()">
                    <option value="" {% if not active_dataset %}selected{% endif %}>Default database</option>
                </select>
            </form>
        </li>
    </ul>    
</nav>
