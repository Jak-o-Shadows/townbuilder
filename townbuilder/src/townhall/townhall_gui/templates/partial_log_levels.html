{# This template fragment renders a dropdown menu with checkbox filters for log levels #}
<details class="log-level-dropdown">
    <summary>Level</summary>
    <div class="log-level-options">
        {% for level in log_levels %}
        <label class="log-level-option">
            <input type="checkbox" name="level" value="{{ level }}" hx-get="{% url 'townhall:log_entries' %}" hx-target="#log-results" hx-swap="innerHTML" hx-trigger="change" hx-include="#log-filters" />
            {{ level }}
        </label>
        {% endfor %}
    </div>
</details>
<p class="hint">Select one or more levels to filter the log results.</p>
